[package]
name = "zpay-x402"
description = "x402 v2 wire adapter for zpay."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
readme = "../../README.md"
keywords = ["zcash", "x402", "agent", "payments", "zpay"]
categories = ["network-programming", "web-programming::http-server"]

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
futures.workspace = true
jsonwebtoken = { workspace = true, features = ["use_pem"] }
metrics.workspace = true
p256 = { workspace = true }
parking_lot.workspace = true
pin-project-lite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
zally-chain = { workspace = true, features = ["zinder"] }
zally-core.workspace = true
zpay-core.workspace = true
zpay-dpop.workspace = true

[dev-dependencies]
p256 = { workspace = true, features = ["pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["std"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
zcash-payment-disclosure.workspace = true
# Pull in zpay-core's in-memory stores for the SSE handler integration
# tests; the production wire path uses the libSQL stores via
# `zpay-runtime`, so the in_memory feature is opt-in here.
zpay-core = { workspace = true, features = ["in_memory"] }
