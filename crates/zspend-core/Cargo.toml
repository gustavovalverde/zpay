[package]
name = "zspend-core"
description = "Service-internal types for the zspend wallet runtime: payment_authorization RAR entry, PRC-7807 problem details, and startup-time signing policy."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
readme = "../../README.md"
keywords = ["zcash", "wallet", "rar", "oauth", "zpay"]
categories = ["cryptography::cryptocurrencies"]

[lints]
workspace = true

[dependencies]
base64.workspace = true
jsonwebtoken = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true
zally-core = { workspace = true, features = ["serde"] }

[dev-dependencies]
hex.workspace = true
jsonwebtoken = { workspace = true, features = ["use_pem"] }
p256 = { workspace = true, features = ["pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["std"] }
ring = "0.17"
serde_json.workspace = true
