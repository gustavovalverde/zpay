[package]
name = "zpay-core"
description = "Protocol-neutral domain types and payment lifecycle for zpay."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
readme = "../../README.md"
keywords = ["zcash", "x402", "facilitator", "payments", "zpay"]
categories = ["network-programming", "api-bindings"]

[lints]
workspace = true

[features]
default = ["in_memory"]
# Bundles the in-memory `PreparedTxStore` and `SettlementLedgerStore`
# implementations used by unit tests and by ad-hoc local dev. Disable
# (`default-features = false`) when shipping a production binary that
# exclusively uses libSQL through `zpay-store`.
in_memory = ["dep:parking_lot"]
# Enables Groth16 verification of Sapling spend proofs inside the
# local ZIP-311 verifier. Disabled by default: Sapling disclosures
# surface as `CryptographicVerdict::Inconclusive { UnsupportedPool }`
# until a Groth16 prover backend is wired in.
verify_sapling = []

[dependencies]
base64.workspace = true
blake2b_simd = "1.0.3"
hex.workspace = true
async-trait.workspace = true
zally-chain = { workspace = true, features = ["zinder"] }
zally-core = { workspace = true }
zally-pczt = { workspace = true }
zally-storage = { workspace = true }
parking_lot = { workspace = true, optional = true }
orchard.workspace = true
pczt.workspace = true
ripemd = "0.1.3"
sapling.workspace = true
secp256k1 = { version = "0.29.1", features = ["recovery"] }
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
thiserror.workspace = true
ulid = { workspace = true, features = ["serde"] }
zcash_keys.workspace = true
zcash_address.workspace = true

[dev-dependencies]
parking_lot.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
toml.workspace = true
