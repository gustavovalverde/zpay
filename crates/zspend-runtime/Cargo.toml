[package]
name = "zspend-runtime"
description = "Wallet runtime binary: signs Zcash transactions under a bounded payment_authorization grant. Phase 4 of Proposal-0003."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
readme = "../../README.md"
keywords = ["zcash", "wallet", "axum", "zpay", "zspend"]
categories = ["network-programming", "web-programming::http-server"]

[lints]
workspace = true

[[bin]]
name = "zspend-runtime"
path = "src/main.rs"

[features]
default = []

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
jsonwebtoken = { workspace = true }
libsql.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zally-chain = { workspace = true, features = ["zinder"] }
zally-core = { workspace = true, features = ["serde"] }
zally-keys.workspace = true
zally-pczt.workspace = true
zally-storage.workspace = true
zally-wallet = { workspace = true, features = ["zinder"] }
zpay-store.workspace = true
zspend-core.workspace = true

[dev-dependencies]
http-body-util = "0.1"
# `use_pem` (a default feature the workspace strips with default-features=false)
# is needed only by the test DPoP-key helper's EncodingKey::from_ec_pem; the
# binary never parses PEM. Cargo unifies the feature into the test profile only.
jsonwebtoken = { workspace = true, features = ["use_pem"] }
p256 = { workspace = true, features = ["pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["std"] }
ring = "0.17"
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
zally-testkit.workspace = true
