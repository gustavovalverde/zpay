[package]
name = "zspend-runtime"
description = "Wallet runtime binary: signs Zcash transactions under a bounded payment_authorization grant. Phase 4 of Proposal-0003."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
readme = "../../README.md"
keywords = ["zcash", "wallet", "axum", "zpay", "zspend"]
categories = ["network-programming", "web-programming::http-server"]

[lints]
workspace = true

[[bin]]
name = "zspend-runtime"
path = "src/main.rs"

[features]
default = []

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
hex.workspace = true
jsonwebtoken = { workspace = true }
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
zally-chain = { workspace = true, features = ["zinder"] }
zally-core = { workspace = true, features = ["serde"] }
zally-keys.workspace = true
zally-storage.workspace = true
zally-wallet = { workspace = true, features = ["zinder"] }
zinder-client.workspace = true
zinder-proto.workspace = true
zpay-core.workspace = true
zspend-core.workspace = true

[dev-dependencies]
http-body-util = "0.1"
ring = "0.17"
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
zally-testkit.workspace = true
