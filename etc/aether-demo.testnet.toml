# Railway test-deployment payee config for the `aether-demo` payee.
#
# `pay_to` is fauzec's donation address: a real, testnet-only address
# already live and receiving funds through the faucet stack. Unlike
# etc/aether-demo.toml's placeholder, this passes the boot-time
# placeholder-receiver gate without ZPAY_ALLOW_DEMO_PAYEE.
#
# This file is the reviewable source of truth for the zpay Railway
# service's ZPAY_PAYEES_TOML variable (see docs/runbooks/railway-deploy.md);
# it is not baked into the image, so any consumer of the plain Dockerfile
# still gets etc/aether-demo.toml's gated placeholder.

[payees."aether-demo"]
accepts = [
  { scheme = "zcash", network = "testnet", pay_to = "utest10t56q4744d9ygg4l7uku7wzgp4kqhxpdajuf8vrgqn7pj6rpecpjfg3f56z95vkvc79tm3kqem0mx27dwp9arkkft56v9duyluqdw5az", amount_zat = 1, max_validity_seconds = 1800 },
]
