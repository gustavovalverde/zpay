# Default payee config baked into the zpay-runtime image.
#
# The `aether-demo` payee matches the demo-rp BFF's default
# `ZPAY_PAYEE_ID`. Operators running a real deployment override
# this file by bind-mounting their own at /etc/zpay/payees.toml
# (see docker-compose.yml's `volumes:` block).
#
# The tracked testnet receiver makes this default usable by the complete
# settlement flow. Production deployments replace this file with their own
# payee registry.

[payees."aether-demo"]
accepts = [
  { scheme = "zcash", network = "testnet", pay_to = "utest10t56q4744d9ygg4l7uku7wzgp4kqhxpdajuf8vrgqn7pj6rpecpjfg3f56z95vkvc79tm3kqem0mx27dwp9arkkft56v9duyluqdw5az", amount_zat = 1, max_validity_seconds = 1800 },
]
