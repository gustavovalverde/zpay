# Dependency policy for the zpay workspace.
#
# Keep this file small. Exceptions should explain the crate and the reason.

[graph]
all-features = true

[advisories]
version = 2
# Each entry names the crate, the dependency path, and why the fix is
# not yet actionable. Revisit when zally bumps zcash_client_backend
# past time-core =0.1.2 and when libsql moves past hyper-rustls 0.25.
ignore = [
    # rustls-webpki vulnerabilities, all reachable only through libsql ->
    # hyper-rustls 0.25 -> rustls 0.22 -> rustls-webpki 0.102.8. zpay does
    # not terminate TLS itself (Railway handles that); libsql connects to
    # Turso over an operator-pinned URL, not to attacker-controlled hosts.
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki CRL Distribution Point matching; libsql 0.9.30 path; no attacker-controlled TLS peer" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki name constraints (URI); libsql 0.9.30 path; clears when libsql lifts to hyper-rustls >=0.27" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki name constraints (wildcard); libsql 0.9.30 path; clears when libsql lifts to hyper-rustls >=0.27" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki CRL parser panic; libsql 0.9.30 path; no operator-controlled CRL ingestion in zpay" },

    # Transitive findings with no compatible fix in the pinned upstream stacks.
    # libsql 0.9.30 -> tonic 0.11 / hyper-rustls 0.25 pins h2 0.3, rustls 0.22,
    # and rustls-webpki 0.102; zpay connects out to an operator-pinned Turso URL
    # and terminates no TLS itself.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 unbounded empty DATA frames; libsql 0.9.30 path; client-only use against an operator-pinned Turso URL; clears when libsql lifts to hyper 1.x" },
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.22.4 Debug exposure of session values; libsql 0.9.30 path; zpay never logs libsql TLS session state" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.22.4 ServerHello downgrade; libsql 0.9.30 path; Turso endpoint is operator-pinned; clears when libsql lifts to rustls 0.23" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102.8 distrusted intermediates; libsql 0.9.30 path; clears when libsql lifts to rustls 0.23" },
    # Zally's wallet stack (zcash_client_sqlite 0.23 -> rusqlite 0.37) pins libsqlite3-sys 0.35.
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite page-cache disclosure needs a crafted wallet.db plus -wal pair; zpay opens only wallet files it creates on its own volume; clears when zcash_client_sqlite lifts to rusqlite 0.41" },
    # p256 0.13 -> elliptic-curve 0.13 -> crypto-bigint 0.5 (DPoP ES256 in zpay-x402, zspend-core, and zspend-runtime).
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 constant-time findings; reached only through p256 0.13 (DPoP ES256), whose field and scalar arithmetic is its own; not confirmed reachable on secret values; revisit when p256 lifts to crypto-bigint 0.7" },
    # age 0.10 build-time localization macro.
    { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained; compile-time only through age -> i18n-config; no runtime exposure" },

    # time 0.3.37 DoS on RFC 2822 parsing. Pinned through rusqlite 0.37,
    # jsonwebtoken 9.3, and the unreleased zcash_client_backend stack. zpay
    # does not parse RFC 2822 input; the only consumer surface is JWT iat/exp
    # via jsonwebtoken.
    { id = "RUSTSEC-2026-0009", reason = "time RFC 2822 DoS; no RFC 2822 parsing on zpay's wire; clears when upstream dependency floor permits time >=0.3.47" },

    # Unmaintained crates with no safe upgrade path. All transitive.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; transitive through libsql replication; not on any external-input path" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; transitive through clap derive; compile-time only" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive through libsql -> hyper-rustls 0.25; clears with libsql bump" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    # Zcash parser stack transitively uses arrayref through BLAKE2b/Equihash.
    { allow = ["BSD-2-Clause"], name = "arrayref" },
    # Zcash script parser transitively uses bounded-vec.
    { allow = ["CC0-1.0"], name = "bounded-vec" },
    # Zcash transparent parsing transitively uses RustCrypto secp256k1 crates.
    { allow = ["CC0-1.0"], name = "secp256k1" },
    { allow = ["CC0-1.0"], name = "secp256k1-sys" },
    # Zebra (via zally-chain / zinder-client) pulls option-ext through dirs.
    { allow = ["MPL-2.0"], name = "option-ext" },
    # jsonrpsee's HTTP client uses rustls-platform-verifier, which bundles
    # Mozilla CA root certificates published under CDLA-Permissive-2.0.
    { allow = ["CDLA-Permissive-2.0"], name = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Sibling library workspace consumed by pinned rev; bump in lockstep with
    # zpay-core when upstream changes the wallet surface.
    "https://github.com/gustavovalverde/zally",
]
