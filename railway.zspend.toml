#:schema https://railway.com/railway.schema.json
# zspend-runtime service config, staged as ./railway.toml by
# scripts/deploy-to-railway.sh (which also overlays Dockerfile.zspend
# as ./Dockerfile). Env vars live in docs/runbooks/railway-deploy.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
numReplicas = 1
