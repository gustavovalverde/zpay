[workspace]
members = [
  "crates/zpay-core",
  "crates/zpay-e2e",
  "crates/zpay-runtime",
  "crates/zpay-store",
  "crates/zpay-x402",
  "crates/zspend-core",
  "crates/zspend-runtime",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/gustavovalverde/zpay"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "original-uri", "query", "tokio", "tracing"] }
base64 = "0.22.1"
blake3 = "1.8.5"
clap = { version = "4.6.1", features = ["derive", "env"] }
config = { version = "0.15.22", default-features = false, features = ["toml"] }
futures = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
jsonwebtoken = { version = "9.3.1", default-features = false }
libsql = "0.9.30"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std", "pem"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
parking_lot = "0.12.5"
pin-project-lite = "0.2.17"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "=0.11.0-pre.4"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.18", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["rt"] }
toml = "1.1.2"
tonic = { version = "0.14.5", default-features = false, features = ["channel", "codegen", "transport"] }
tower-http = { version = "0.6.11", features = ["request-id", "timeout", "trace"] }
tracing = "0.1.44"
url = "2.5.8"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "smallvec", "std", "tracing-log"] }
ulid = "1.2.1"
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }

# Internal crates: pinned by version and path so downstream consumers can vendor
# either form; matches the fauzec workspace convention.
zpay-core = { version = "0.1.0", path = "crates/zpay-core", default-features = false }
zpay-e2e = { version = "0.1.0", path = "crates/zpay-e2e" }
zpay-runtime = { version = "0.1.0", path = "crates/zpay-runtime" }
zpay-store = { version = "0.1.0", path = "crates/zpay-store" }
zpay-x402 = { version = "0.1.0", path = "crates/zpay-x402" }
zspend-core = { version = "0.1.0", path = "crates/zspend-core" }
zspend-runtime = { version = "0.1.0", path = "crates/zspend-runtime" }

# Sibling workspaces consumed by pinned git rev so Railway's docker build (which
# has no access to the sibling directory on disk) and `cargo` clones resolve
# from the same source as local dev. Bump `rev` when promoting an upstream
# change into zpay.
zally-chain = { git = "https://github.com/gustavovalverde/zally", rev = "ec5b213f82fdc28dba211802bdc3cf3936cd4823", features = ["zinder"] }
zally-core = { git = "https://github.com/gustavovalverde/zally", rev = "ec5b213f82fdc28dba211802bdc3cf3936cd4823" }
zally-keys = { git = "https://github.com/gustavovalverde/zally", rev = "ec5b213f82fdc28dba211802bdc3cf3936cd4823" }
zally-storage = { git = "https://github.com/gustavovalverde/zally", rev = "ec5b213f82fdc28dba211802bdc3cf3936cd4823" }
zally-testkit = { git = "https://github.com/gustavovalverde/zally", rev = "ec5b213f82fdc28dba211802bdc3cf3936cd4823" }
zally-wallet = { git = "https://github.com/gustavovalverde/zally", rev = "ec5b213f82fdc28dba211802bdc3cf3936cd4823", features = ["zinder"] }
zinder-client = { git = "https://github.com/gustavovalverde/zinder", rev = "74abb4b8f708dfb511c5f301c3d59f2127a5e2ed" }
zinder-proto = { git = "https://github.com/gustavovalverde/zinder", rev = "74abb4b8f708dfb511c5f301c3d59f2127a5e2ed" }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
expect_used = "deny"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
redundant_pub_crate = "allow"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

# Pinned to a fork of the librustzcash workspace tracking the unreleased
# Ironwood/NU6.3 dependency family. Two patches ride on top of upstream main:
# the `target_expiry_height` argument on `create_pczt_from_proposal`
# (https://github.com/zcash/librustzcash/pull/2412) and wallet scanning/storage
# for the Ironwood shielded pool (https://github.com/zcash/librustzcash/pull/2539).
# Every librustzcash-internal crate is patched from the same commit so
# intra-workspace types stay coherent. Drop once upstream releases ship both.
[patch.crates-io]
zcash_client_backend = { git = "https://github.com/gustavovalverde/librustzcash.git", rev = "235d581f2c6eface19e857e69e9bfa4765c2d4bf" }
zcash_client_sqlite = { git = "https://github.com/gustavovalverde/librustzcash.git", rev = "235d581f2c6eface19e857e69e9bfa4765c2d4bf" }
pczt = { git = "https://github.com/gustavovalverde/librustzcash.git", rev = "235d581f2c6eface19e857e69e9bfa4765c2d4bf" }
zcash_protocol = { git = "https://github.com/gustavovalverde/librustzcash.git", rev = "235d581f2c6eface19e857e69e9bfa4765c2d4bf" }
zcash_primitives = { git = "https://github.com/gustavovalverde/librustzcash.git", rev = "235d581f2c6eface19e857e69e9bfa4765c2d4bf" }
zcash_keys = { git = "https://github.com/gustavovalverde/librustzcash.git", rev = "235d581f2c6eface19e857e69e9bfa4765c2d4bf" }
zcash_address = { git = "https://github.com/gustavovalverde/librustzcash.git", rev = "235d581f2c6eface19e857e69e9bfa4765c2d4bf" }
zcash_transparent = { git = "https://github.com/gustavovalverde/librustzcash.git", rev = "235d581f2c6eface19e857e69e9bfa4765c2d4bf" }
zcash_proofs = { git = "https://github.com/gustavovalverde/librustzcash.git", rev = "235d581f2c6eface19e857e69e9bfa4765c2d4bf" }
zip321 = { git = "https://github.com/gustavovalverde/librustzcash.git", rev = "235d581f2c6eface19e857e69e9bfa4765c2d4bf" }
