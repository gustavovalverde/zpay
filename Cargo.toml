[workspace]
members = [
  "crates/zpay-demo",
  "crates/zpay-core",
  "crates/zpay-e2e",
  "crates/zpay-runtime",
  "crates/zpay-store",
  "crates/zpay-x402",
  "crates/zspend-core",
  "crates/zspend-runtime",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/gustavovalverde/zpay"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "original-uri", "query", "tokio", "tracing"] }
base64 = "0.22.1"
blake3 = "1.8.5"
clap = { version = "4.6.1", features = ["derive", "env"] }
config = { version = "0.15.22", default-features = false, features = ["toml"] }
futures = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
jsonwebtoken = { version = "9.3.1", default-features = false }
libsql = "0.9.30"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std", "pem"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
parking_lot = "0.12.5"
pin-project-lite = "0.2.17"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "=0.11.0-pre.4"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.18", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["rt"] }
toml = "1.1.2"
tonic = { version = "0.14.5", default-features = false, features = ["channel", "codegen", "transport"] }
tower-http = { version = "0.6.11", features = ["request-id", "timeout", "trace"] }
tracing = "0.1.44"
url = "2.5.8"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "smallvec", "std", "tracing-log"] }
ulid = "1.2.1"
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }
pczt = { version = "0.7", features = ["orchard", "sapling", "transparent", "tx-extractor"] }
orchard = "0.15.0-pre.2"
sapling = { package = "sapling-crypto", version = "0.7" }
zcash_keys = { version = "0.15.0-pre.0", features = ["orchard", "sapling", "transparent-inputs"] }
zcash_address = { version = "0.13.0-pre.0" }

# Internal crates: pinned by version and path so downstream consumers can vendor
# either form; matches the fauzec workspace convention.
zpay-core = { version = "0.1.0", path = "crates/zpay-core", default-features = false }
zpay-demo = { version = "0.1.0", path = "crates/zpay-demo" }
zpay-e2e = { version = "0.1.0", path = "crates/zpay-e2e" }
zpay-runtime = { version = "0.1.0", path = "crates/zpay-runtime" }
zpay-store = { version = "0.1.0", path = "crates/zpay-store" }
zpay-x402 = { version = "0.1.0", path = "crates/zpay-x402" }
zspend-core = { version = "0.1.0", path = "crates/zspend-core" }
zspend-runtime = { version = "0.1.0", path = "crates/zspend-runtime" }

# Sibling workspaces consumed by pinned git rev so Railway's docker build (which
# has no access to the sibling directory on disk) and `cargo` clones resolve
# from the same source as local dev. Bump `rev` when promoting an upstream
# change into zpay.
zally-chain = { git = "https://github.com/gustavovalverde/zally", rev = "3d2b8234e068fb81c4729f54ca4b13b34e763e1f", features = ["zinder"] }
zally-core = { git = "https://github.com/gustavovalverde/zally", rev = "3d2b8234e068fb81c4729f54ca4b13b34e763e1f" }
zally-keys = { git = "https://github.com/gustavovalverde/zally", rev = "3d2b8234e068fb81c4729f54ca4b13b34e763e1f" }
zally-pczt = { git = "https://github.com/gustavovalverde/zally", rev = "3d2b8234e068fb81c4729f54ca4b13b34e763e1f" }
zally-storage = { git = "https://github.com/gustavovalverde/zally", rev = "3d2b8234e068fb81c4729f54ca4b13b34e763e1f" }
zally-testkit = { git = "https://github.com/gustavovalverde/zally", rev = "3d2b8234e068fb81c4729f54ca4b13b34e763e1f" }
zally-wallet = { git = "https://github.com/gustavovalverde/zally", rev = "3d2b8234e068fb81c4729f54ca4b13b34e763e1f", features = ["zinder"] }
zinder-client = { git = "https://github.com/gustavovalverde/zinder", rev = "c604ac3d260b4e65219dbeb6062d01d213d65ea9" }
zinder-proto = { git = "https://github.com/gustavovalverde/zinder", rev = "c604ac3d260b4e65219dbeb6062d01d213d65ea9" }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
expect_used = "deny"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
redundant_pub_crate = "allow"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

# Mirrors zally's [patch.crates-io]: Cargo patch sections do not propagate from
# git dependencies, so the workspace that builds zally-storage must repeat the
# full pin set. Drop this once the NU6.3/Ironwood librustzcash stack ships from
# crates.io.
[patch.crates-io]
orchard = { git = "https://github.com/zcash/orchard", rev = "475ef0ff77d45aebff93cb039d639250d82518a3" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "8e6864a3c67cab3c64a052dd20f83c553662e8b2" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash.git", rev = "8e6864a3c67cab3c64a052dd20f83c553662e8b2" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash.git", rev = "8e6864a3c67cab3c64a052dd20f83c553662e8b2" }
equihash = { git = "https://github.com/zcash/librustzcash.git", rev = "8e6864a3c67cab3c64a052dd20f83c553662e8b2" }
pczt = { git = "https://github.com/zcash/librustzcash.git", rev = "8e6864a3c67cab3c64a052dd20f83c553662e8b2" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "8e6864a3c67cab3c64a052dd20f83c553662e8b2" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "8e6864a3c67cab3c64a052dd20f83c553662e8b2" }
zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "8e6864a3c67cab3c64a052dd20f83c553662e8b2" }
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "8e6864a3c67cab3c64a052dd20f83c553662e8b2" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash.git", rev = "8e6864a3c67cab3c64a052dd20f83c553662e8b2" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash.git", rev = "8e6864a3c67cab3c64a052dd20f83c553662e8b2" }
zip321 = { git = "https://github.com/zcash/librustzcash.git", rev = "8e6864a3c67cab3c64a052dd20f83c553662e8b2" }
# Mirrors zally's shardtree/incrementalmerkletree patch: the fork's
# anchor-retention APIs exist only at this incrementalmerkletree rev.
shardtree = { git = "https://github.com/gustavovalverde/incrementalmerkletree", rev = "48b5297872f9c321e7d7e65b803132362035c4ee" }
incrementalmerkletree = { git = "https://github.com/gustavovalverde/incrementalmerkletree", rev = "48b5297872f9c321e7d7e65b803132362035c4ee" }
