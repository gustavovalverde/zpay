# zpay docker stack.
#
# Designed to attach to the shared `zcash-x402-demo` network. The
# network is created by whichever compose stack comes up first (either
# this one or any consumer like demo-rp); both sides reference it as
# `external: true` so neither pretends to own it. The name is
# protocol-shaped, not vendor-shaped, so future consumers do not
# inherit a name that belongs to a single relying party.
#
# Standalone use (no consumers): comment out the `networks:` blocks
# below; `zpay` will sit on the default compose network and be
# reachable on the host at http://127.0.0.1:8080.

services:
  zpay:
    build:
      context: .
      dockerfile: Dockerfile
    image: zpay-runtime:dev
    ports:
      # App listener (the URL consumers talk to).
      - "8080:8080"
      # Ops listener (metrics, health probes).
      - "9295:9295"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      ZPAY_NETWORK: ${ZPAY_NETWORK:-testnet}
      # ZIP-311 BLAKE2b digest personalization pins to a SLIP-44 coin
      # type. Required (no default at runtime); regtest stacks pin to
      # testnet explicitly. See ADR-0007.
      # libSQL file lives on a named volume so prepared/ledger rows
      # survive `docker compose down` without `--volumes`.
      ZPAY_STORE__BACKEND: libsql
      ZPAY_STORE__URL: file:/var/lib/zpay/zpay.libsql
      ZPAY_PAYEES__CONFIG_PATH: /etc/zpay/payees.toml
      # Testnet zinder native WalletQuery endpoint used by the broadcast
      # plane, tip oracle, and confirmation oracle. The default points
      # at the in-network `zinder-query` alias on the shared
      # `z3-testnet` network; bring up the zinder-testnet stack first
      # (`docker compose -f /path/to/zinder/compose.yml up -d`) or
      # override with your own native WalletQuery endpoint.
      ZPAY_CHAIN_SOURCE_URL: ${ZPAY_CHAIN_SOURCE_URL:-http://zinder-query:9102}
      # zpay extracts signed PCZTs for `/x402/v2/verify` and `/x402/v2/settle`.
      # Sapling verification parameters must be available through the default
      # zcash_proofs location, just like zspend's local prover.
      HOME: /opt/zpay-home
      # Stable DPoP correlation seed so jti replay state and key
      # thumbprints survive a container restart in the demo stack.
      # Production deployments MUST override this with a per-instance
      # high-entropy secret; the value below is intentionally
      # well-known and not safe outside dev.
      ZPAY_DPOP_KEY_SEED: ${ZPAY_DPOP_KEY_SEED:-dev-only-aether-bff-dpop-seed-do-not-use-in-prod-stable-48chars}
    volumes:
      - zpay-data:/var/lib/zpay
      - ./etc/aether-demo.testnet.toml:/etc/zpay/payees.toml:ro
      - ${ZCASH_PARAMS_HOST_DIR:-${HOME}/.zcash-params}:/opt/zpay-home/.zcash-params:ro
      - ${ZCASH_PARAMS_HOST_DIR:-${HOME}/.zcash-params}:/home/zpay/.zcash-params:ro
    restart: unless-stopped
    networks:
      - zcash-x402-demo
      # Joins the zinder-testnet stack's network so the in-network
      # `zinder-query` alias resolves for ZPAY_CHAIN_SOURCE_URL.
      - z3-testnet

  # Phase 4 wallet runtime. Signs Zcash transactions under a bounded
  # `payment_authorization` grant (Proposal-0003 D-1). Runs as its own
  # service so the facilitator (`zpay`) stays broadcaster-only (D-9).
  # The sealed seed and the wallet database are persisted on the
  # `zspend-data` volume; rotate by removing the volume.
  zspend:
    build:
      context: .
      dockerfile: Dockerfile.zspend
    image: zspend-runtime:dev
    ports:
      # Wallet runtime listener (the URL the agent BFF talks to).
      - "8090:8090"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      ZSPEND_NETWORK: ${ZSPEND_NETWORK:-testnet}
      ZSPEND_SEALED_SEED_PATH: /var/lib/zspend/wallet.age
      ZSPEND_STORAGE_PATH: /var/lib/zspend/wallet.db
      # Dev-only: let the entrypoint auto-provision a throwaway sealed seed
      # when the volume is empty. Production MUST leave this unset and run
      # `zspend-runtime init` (or `init --restore`) so the mnemonic is backed
      # up offline; the entrypoint refuses to boot otherwise.
      ZSPEND_ALLOW_AUTO_PROVISION: "1"
      # Dev-only: the age-file sealing is a dev-posture seed. Production MUST
      # front the seed with a KMS/HSM sealing; the runtime refuses to serve a
      # dev-posture seed unless this override is set.
      ZSPEND_ALLOW_DEV_SEED: "1"
      # Point home_dir() at a writable path whose `.zcash-params`
      # subdirectory is the host params bind-mount below. zcash_proofs
      # locates sapling-spend.params and sapling-output.params via
      # `home::home_dir().join(".zcash-params")` on Linux and does not
      # honor an explicit env override.
      HOME: /opt/zspend-home
      # Required on first boot to materialise the wallet account row from the
      # sealed seed. The bootstrap reads the chain tip from this endpoint when
      # ZSPEND_BIRTHDAY_HEIGHT is unset, then writes a single account anchored
      # at that height. Subsequent boots reuse the existing row and do not
      # contact this endpoint. Defaults to the in-network `zinder-query` alias
      # on the `z3-testnet` network shared with zpay.
      ZSPEND_CHAIN_SOURCE_URL: ${ZSPEND_CHAIN_SOURCE_URL:-http://zinder-query:9102}
      # Optional overrides; see crates/zspend-runtime/src/main.rs.
      # ZSPEND_MAX_AMOUNT_ZAT: "100000000"
      ZSPEND_AUDIENCE: ${ZSPEND_AUDIENCE:-urn:zpay:zspend:local-dev}
      ZSPEND_JWKS_FILE: ${ZSPEND_JWKS_FILE:-}
      ZSPEND_PUBLIC_URL: ${ZSPEND_PUBLIC_URL:-http://127.0.0.1:8090}
      # Pinned to a height well below zinder's settled tip so the
      # first-boot tree_state_at(birthday - 1) lookup hits an
      # already-indexed checkpoint. zinder's settled tip lags the visible
      # tip by the configured reorg window, so
      # without this override the bootstrap queries tree state past
      # the settled tip and zinder returns ServiceUnavailable.
      ZSPEND_BIRTHDAY_HEIGHT: ${ZSPEND_BIRTHDAY_HEIGHT:-4050200}
    volumes:
      - zspend-data:/var/lib/zspend
      # Sapling trusted-setup parameters needed by the Local prover.
      # Defaults to the host's macOS XDG location; override with
      # ZCASH_PARAMS_HOST_DIR to point at a custom location. Read-only
      # so the container cannot mutate the trusted-setup blobs. Mounted
      # at both candidate locations so the binary resolves them whether
      # `home::home_dir()` returns the `HOME` env value or the
      # `/etc/passwd` pwent for uid 10001.
      - ${ZCASH_PARAMS_HOST_DIR:-${HOME}/.zcash-params}:/opt/zspend-home/.zcash-params:ro
      - ${ZCASH_PARAMS_HOST_DIR:-${HOME}/.zcash-params}:/home/zspend/.zcash-params:ro
    restart: unless-stopped
    networks:
      - zcash-x402-demo
      # Joins the zinder-testnet stack's network so the in-network
      # `zinder-query` alias resolves for ZSPEND_CHAIN_SOURCE_URL
      # during the first-boot account bootstrap.
      - z3-testnet

volumes:
  zpay-data:
  zspend-data:

networks:
  # External: created by whichever compose stack runs first.
  # `docker network create zcash-x402-demo` ahead of time also works.
  zcash-x402-demo:
    external: true
  # External: owned by the zinder-testnet stack. zpay joins it so the
  # in-network `zinder-query` alias resolves for the native WalletQuery
  # endpoint.
  z3-testnet:
    external: true
