name: ci-pr

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.19.4"
  CARGO_MACHETE_VERSION: "0.9.2"
  CARGO_NEXTEST_VERSION: "0.9.116"

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version "${CARGO_NEXTEST_VERSION}"

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test (unit + integration)
        run: cargo nextest run --profile=ci

      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

      - name: Diff hygiene
        run: git diff --check

  dependencies:
    name: dependency hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Guard facilitator store linkage
        run: |
          if cargo tree -p zpay-store --all-features -e normal | rg --quiet 'libsqlite3-sys'; then
            printf '%s\n' 'zpay-store must not link zally wallet SQLite'
            exit 1
          fi

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "${CARGO_DENY_VERSION}"

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version "${CARGO_MACHETE_VERSION}"

      - name: Deny
        run: cargo deny check

      - name: Machete
        run: cargo machete
