name: live-tests

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to run live tests against"
        required: true
        default: "regtest"
        type: choice
        options:
          - regtest
          - testnet
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NEXTEST_VERSION: "0.9.116"

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZPAY_TEST_LIVE: "1"
      ZPAY_NETWORK_INPUT: ${{ github.event.inputs.network }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version "${CARGO_NEXTEST_VERSION}"

      - name: Resolve network
        run: |
          NETWORK="${ZPAY_NETWORK_INPUT:-regtest}"
          case "${NETWORK}" in
            regtest|testnet) ;;
            *) echo "Refusing unknown network: ${NETWORK}"; exit 1 ;;
          esac
          echo "ZPAY_NETWORK=${NETWORK}" >> "${GITHUB_ENV}"

      - name: Run live tests
        run: cargo nextest run --profile=ci-live --run-ignored=all
